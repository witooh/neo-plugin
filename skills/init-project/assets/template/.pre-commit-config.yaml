# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
- pre-commit
- pre-push
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-json
  - id: check-added-large-files
    args: ["--maxkb=2000"]
- repo: local
  hooks:
  - id: govulncheck
    name: Vulnerability check
    entry: go tool -modfile=tools/govulncheck/go.mod govulncheck ./...
    types: [go]
    language: golang
    always_run: true
    pass_filenames: false
    stages:
      - pre-push
  # - id: sqlc-generate
  #   name: SQLC Generate
  #   entry: go tool sqlc generate
  #   language: system
  #   always_run: true
  #   pass_filenames: false
  # - id: sqlc-diff
  #   name: SQLC Diff
  #   entry: go tool sqlc diff
  #   language: system
  #   always_run: true
  #   pass_filenames: false
  - id: linter
    name: Linter
    entry: go tool -modfile=tools/golangci-lint/go.mod golangci-lint run --new-from-rev HEAD --fix --timeout=5m
    types: [go]
    language: golang
    require_serial: true
    pass_filenames: false
    stages:
      - pre-push
