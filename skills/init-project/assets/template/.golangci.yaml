version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errname
    - exhaustive
    - forbidigo
    - nilerr
    - nilnesserr
    - nilnil
    - unused
  settings:
    # Machine form of the structure.md "deterministic-by-injection" invariant: business logic in
    # domain/usecase must not reach an ambient / non-deterministic source directly — it takes the
    # value (now time.Time) or injects the port (clock.Clock / idgen.Generator). Scoped to core via
    # the exclusions below (adapters/delivery/cmd are the edge; pkg/clock+pkg/idgen are the System()
    # impls; tests pin a fixed clock). This is what keeps the testability seam from rotting.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.Now$'
          msg: 'deterministic-by-injection: a domain service takes now time.Time; a usecase injects clock.Clock — never call time.Now() in core (structure.md "Ambient capabilities")'
        - pattern: '^uuid\.New(String)?$'
          msg: 'deterministic-by-injection: inject idgen.Generator — never call uuid.New()/NewString() in core (structure.md "Ambient capabilities")'
    # Machine form of the structure.md dependency rule: imports point inward only
    # (delivery / adapters -> usecase -> domain). A cross-layer import fails the build.
    depguard:
      rules:
        domain:
          files:
            - "**/internal/core/domain/**"
          deny:
            - pkg: example.com/neo/service/internal/core/usecase
              desc: domain is the core — it must not import usecase (imports point inward only; see structure.md)
            - pkg: example.com/neo/service/internal/delivery
              desc: domain must not import delivery
            - pkg: example.com/neo/service/internal/adapters
              desc: domain must not import adapters (program to its own co-located ports)
            # Framework independence — domain is pure business rules (structure.md / domain.md).
            - pkg: github.com/gin-gonic/gin
              desc: domain stays framework-free — no HTTP/transport types
            - pkg: net/http
              desc: domain stays transport-free — no net/http
            - pkg: database/sql
              desc: domain stays persistence-free — no SQL types
            - pkg: github.com/jackc/pgx
              desc: domain stays persistence-free — no DB driver
            - pkg: github.com/redis/go-redis
              desc: domain stays infra-free — no cache client
            - pkg: github.com/segmentio/kafka-go
              desc: domain stays infra-free — no messaging client
        usecase:
          files:
            - "**/internal/core/usecase/**"
          deny:
            - pkg: example.com/neo/service/internal/delivery
              desc: usecase must not import delivery (it is called by delivery, not the reverse)
            - pkg: example.com/neo/service/internal/adapters
              desc: usecase must not import a concrete adapter — depend on the domain port instead
            # Framework independence — usecase orchestrates, it does not touch transport/persistence.
            - pkg: github.com/gin-gonic/gin
              desc: usecase stays framework-free — no HTTP/transport types
            - pkg: net/http
              desc: usecase stays transport-free — no net/http
            - pkg: database/sql
              desc: usecase stays persistence-free — no SQL types
            - pkg: github.com/jackc/pgx
              desc: usecase stays persistence-free — no DB driver
            - pkg: github.com/redis/go-redis
              desc: usecase stays infra-free — no cache client
            - pkg: github.com/segmentio/kafka-go
              desc: usecase stays infra-free — no messaging client
        adapters:
          files:
            - "**/internal/adapters/**"
          deny:
            - pkg: example.com/neo/service/internal/core/usecase
              desc: adapters implement domain ports — they must not call up into usecase
            - pkg: example.com/neo/service/internal/delivery
              desc: adapters must not import delivery (driven and driving never import each other)
        delivery:
          files:
            - "**/internal/delivery/**"
          deny:
            - pkg: example.com/neo/service/internal/adapters
              desc: delivery (driving) must not reach any outbound adapter (gateway/repository/eventbus) — go through a usecase, or import a shared contract from pkg/ (e.g. pkg/messaging)
  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - nilnil
      # deterministic-by-injection (forbidigo) is a CORE-only rule: only domain/usecase must stay
      # ambient-free. The edge layers may read the clock / mint ids, pkg/clock + pkg/idgen ARE the
      # System() impls, and tests pin a fixed clock — so forbidigo applies to internal/core/** alone.
      - path: 'internal/adapters/|internal/delivery/|cmd/|pkg/|_test\.go'
        linters:
          - forbidigo
