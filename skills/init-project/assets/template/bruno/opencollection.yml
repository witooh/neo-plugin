opencollection: 1.0.0

info:
  name: neo-service API

docs: |-
  # neo-service API

  This Bruno OpenCollection is generated from the api-spec at `docs/api/*.yaml`
  by the `open-collection` skill. A freshly scaffolded service has no endpoints
  yet — neo's Architect authors the api-spec as it adds the first domain, then
  regenerate this collection.

bundled: false

extensions:
  bruno:
    ignore:
      - node_modules
      - .git
