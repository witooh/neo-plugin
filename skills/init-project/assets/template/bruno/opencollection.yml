opencollection: 1.0.0

info:
  name: neo-service API

docs: |-
  ## Overview

  neo-service API. A freshly scaffolded service has no endpoints yet; each
  endpoint is documented in its own request as it is added.

  ## Error Response Body

  | Field Name | Type | Mandatory | Description | Possible Value |
  |---|---|---|---|---|
  | responseCode | String | Yes | Response code | `"001"` |
  | errorCode | String | Yes | Error code | `"NZQ-NNNN"` |
  | errorMessage | String | Yes | Error message for logs and support | `"Mandatory field missing"` |

  ## Common Error Responses

  | Status | Response Code | Error Code | Error Messages | Description |
  |---|---|---|---|---|

bundled: false

extensions:
  bruno:
    ignore:
      - node_modules
      - .git
