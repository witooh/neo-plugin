all: false
dir: "{{.InterfaceDir}}"
filename: "{{.SrcPackageName}}.go"
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: error
structname: "{{.Mock}}{{.InterfaceName}}"
pkgname: "mock{{.SrcPackageName}}"
recursive: true
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
# A freshly scaffolded service mocks only its shared pkg/ interfaces. neo adds a
# package entry here per layer it introduces — gateway, eventbus, core/domain —
# mirroring the structure documented in .kiro/steering/tooling.md.
packages:
  example.com/neo/service/pkg:
    config:
      all: true
      dir: pkg/mocks/{{ trimPrefix "pkg" .InterfaceDirRelative }}
