stages:
  - prepare-mod
  - test
  - build

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: "" # disable TLS for DinD
  DOCKER_DRIVER: "overlay2"
  DOCKER_BUILDKIT: "1"
  BASE_VERSION: "1.0.0" # Base semantic version for image tags
  ECR_URI: "${AWS_ACCOUNT_ID_N005}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  GOPATH: ${CI_PROJECT_DIR}/.go
  # Ensure GOPATH/bin is on PATH so installed binaries (e.g. orchestrion) are found
  PATH: "${CI_PROJECT_DIR}/.go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

cache:
  paths:
    - .go/pkg/mod/
    - .go/bin/

prepare-mod:
  stage: prepare-mod
  tags: ["linux"]
  image: public.ecr.aws/docker/library/golang:1.26
  interruptible: true
  retry: 1
  resource_group: "ecr-push-${CI_PROJECT_PATH}"
  rules:
    - when: always
  script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.awesome-poc-th.com/".insteadOf "https://gitlab.awesome-poc-th.com/"
    - go env -w GOPRIVATE=gitlab.awesome-poc-th.com/libero-engineering/core/*
    - go mod download
    - go mod vendor
  artifacts:
    paths:
      - vendor
    expire_in: 1 day

test:
  tags: ["linux"]
  image: public.ecr.aws/docker/library/golang:1.26
  stage: test
  needs: ["prepare-mod"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - go test -short -mod=vendor ./... -coverprofile=cover.profile -coverpkg=$(go list -mod=vendor ./... | grep -vE '/internal/mocks(/|$)' | tr '\n' ',')
    - go tool cover -func cover.profile
  coverage: '/total:\s+\(statements\)\s+\d+.\d+%/'
  artifacts:
    paths:
      - cover.profile
    expire_in: 1 day

build:
  stage: build
  tags: ["linux"]
  image: public.ecr.aws/docker/library/docker:28.5.1
  services:
    - name: public.ecr.aws/docker/library/docker:28.5.1-dind
      alias: docker
  interruptible: true
  retry: 1
  resource_group: "ecr-push-${CI_PROJECT_PATH}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  before_script:
    # Generate semver-compliant image tag
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        # Use git tag as-is for releases (e.g., v1.2.3)
        export IMAGE_TAG="${CI_COMMIT_TAG}"
      else
        # Convert branch name to Docker-safe format (replace special chars with hyphens)
        SAFE_BRANCH=$(echo "${CI_COMMIT_BRANCH}" | sed 's/[^a-zA-Z0-9._-]/-/g')
        # Format: BASE_VERSION-branch.commit.pipeline (e.g., 1.0.0-main.abc1234.567890)
        export IMAGE_TAG="${BASE_VERSION}-${SAFE_BRANCH}.${CI_COMMIT_SHORT_SHA}.${CI_PIPELINE_ID}"
      fi
      echo "Using IMAGE_TAG: ${IMAGE_TAG}"

    - set -euo pipefail
    - apk add --no-cache --quiet jq aws-cli

    # Assume role in n005
    - |
      echo "Assuming role: ${ROLE_ARN_N005}"
      ASSUME_JSON="$(aws sts assume-role \
        --role-arn "${ROLE_ARN_N005}" \
        --role-session-name "gitlab-ecr-${CI_PIPELINE_ID}" \
        --duration-seconds 3600)"
      export AWS_ACCESS_KEY_ID="$(echo "${ASSUME_JSON}" | jq -r .Credentials.AccessKeyId)"
      export AWS_SECRET_ACCESS_KEY="$(echo "${ASSUME_JSON}" | jq -r .Credentials.SecretAccessKey)"
      export AWS_SESSION_TOKEN="$(echo "${ASSUME_JSON}" | jq -r .Credentials.SessionToken)"

    # Login to ECR
    - |
      echo "Logging in to ECR: ${ECR_URI}"
      aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
        | docker login --username AWS --password-stdin "${ECR_URI}"

    # Ensure repo exists
    - |
      echo "Ensuring ECR repo exists: ${ECR_REPO_NAME}"
      aws ecr describe-repositories --repository-names "${ECR_REPO_NAME}" >/dev/null 2>&1 || \
        aws ecr create-repository --repository-name "${ECR_REPO_NAME}" >/dev/null

  script:
    - |
      set -euo pipefail
      echo "Building image: ${ECR_REPO_NAME}:${IMAGE_TAG}"
      docker build -t "${ECR_REPO_NAME}:${IMAGE_TAG}" .

      echo "Tag & push ${IMAGE_TAG}"
      docker tag "${ECR_REPO_NAME}:${IMAGE_TAG}" "${ECR_URI}/${ECR_REPO_NAME}:${IMAGE_TAG}"
      docker push "${ECR_URI}/${ECR_REPO_NAME}:${IMAGE_TAG}"
