services:
  neo-service:
    build: .
    container_name: neo-service
    ports:
      - "8080:8080"
    environment:
      - DD_ENV=local
      - DD_SERVICE=neo-service
      - DD_VERSION=local
      - DD_AGENT_HOST=localhost
      - DD_TRACE_AGENT_PORT=8126
      - DD_PROFILING_ENABLED=false
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      # neo's first event-publishing domain adds a kafka-init container here to
      # pre-create its topics; auto-create keeps local dev frictionless until then.
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  valkey:
    image: valkey/valkey-bundle:8-alpine
    container_name: valkey
    restart: always
    ports:
      - "6379:6379"
    command: >
      --requirepass ${VALKEY_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      # Services share the sit_core database; each service owns one schema inside it,
      # pinned via search_path in every connection string.
      - POSTGRES_DB=sit_core
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sit_core"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: creates the service schema before neo-service starts and before
  # migration-up runs (compose-up blocks on neo-service's depends_on, which waits
  # for this to complete).
  postgres-init:
    image: postgres:17-alpine
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U postgres -d sit_core -c 'CREATE SCHEMA IF NOT EXISTS neoschema;'
    environment:
      - PGPASSWORD=password
