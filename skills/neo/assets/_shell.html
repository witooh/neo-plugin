<!-- ============================================================================
  _shell.html — page skeleton for every Design Docs HTML page.
  This is a TEMPLATE (not a standalone page) — it lives in the skill bundle only,
  NEVER copy it into a project's docs/design/ (its {{...}} placeholders are not valid HTML).

  To build a page: copy this skeleton and replace the placeholders:
    {{LANG}}          html lang, e.g. "th"
    {{ASSET_PREFIX}}  relative path from THIS page up to docs/design/ root:
                        docs/design/index.html              → ""        (root)
                        docs/design/{usecase}/x.html        → "../"      (1 level deep)
                        docs/design/system-design/x.html    → "../"      (1 level deep)
                      Use the SAME value in <link>, both <script src>, and data-asset-prefix.
    {{DOC_TITLE}}     <title> text, e.g. "Acceptance Criteria · <Usecase> — Design Docs"
    {{TOPBAR_TITLE}}  short mobile topbar label, e.g. "Acceptance Criteria"
    {{DOC_HEADER}}    the <header class="doc-header"> block (crumbs + h1 + lede + doc-meta)
    {{CONTENT}}       the page body (sections built from components — see components.html / html-output.md)

  The sidebar is LEFT EMPTY on purpose — app.js (renderNav) fills it from assets/js/nav.js.
  Load order is load-bearing: mermaid CDN → nav.js → components.js → app.js (do not reorder).
  components.js (defines <ac-card>) MUST be a classic script BEFORE app.js so cards upgrade
  to .card synchronously before app.js's on-load $$(".card") scans run.
  The inline FOUC script key MUST stay "ds-theme" (matches THEME_KEY in app.js).
============================================================================ -->
<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="light" data-asset-prefix="{{ASSET_PREFIX}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOC_TITLE}}</title>
<link rel="stylesheet" href="{{ASSET_PREFIX}}assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem('ds-theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<a class="skip-link" href="#main">ข้ามไปยังเนื้อหา</a>

<header class="topbar">
  <button class="icon-btn js-nav-toggle" aria-label="เมนู">☰</button>
  <span class="topbar__title">{{TOPBAR_TITLE}}</span>
  <button class="icon-btn js-theme-toggle" aria-label="สลับธีม" style="margin-left:auto"><span class="js-theme-ico">☾</span></button>
</header>
<div class="nav-scrim"></div>

<div class="layout">

  <aside class="sidebar"></aside>

  <main class="main" id="main">
    {{DOC_HEADER}}
    {{CONTENT}}
  </main>

  <aside class="toc"><div class="toc__title">ในหน้านี้</div><nav class="toc__list"></nav></aside>
</div>

<button class="scroll-top" aria-label="ขึ้นบนสุด">↑</button>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="{{ASSET_PREFIX}}assets/js/nav.js"></script>
<script src="{{ASSET_PREFIX}}assets/js/components.js"></script>
<script src="{{ASSET_PREFIX}}assets/js/app.js"></script>
</body>
</html>
