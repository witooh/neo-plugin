info:
  name: Create Account
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/v1/accounts"
  headers:
    - name: X-Trace
      value: keep-me
  body:
    type: json
    data: |-
      {
        "customerId": "{{customerId}}",
        "count": 1,
        "items": [{"code": "X1"}]
      }
  auth: inherit

docs: |-
  # Create Account

  Open an account for a customer. Covers AC-001.

  - **Method:** `POST`
  - **Path:** `/v1/accounts`
  - **Auth:** `None`

  ## Request Body

  | Field Name | Description | Type | Mandatory | Example | Remark |
  | ---------- | ----------- | ---- | --------- | ------- | ------ |
  | `customerId` | Owner of the account | String | M | `"uuid-v4"` | |

settings:
