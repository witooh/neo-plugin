endpoint: Create Account
domain: Account
method: POST
path: /v1/accounts
auth: None
covers_ac: [AC-001]
description: |
  Open an account for a customer.
request_body:
  fields:
    - { name: customerId, description: Owner of the account, type: String, mandatory: M, example: "uuid-v4" }
    - { name: count, description: Number of cards, type: Integer, mandatory: O, example: 1, remark: "One of `1` | `2`" }
    - { name: items, description: Extra items, type: Array, mandatory: O, object: Item }
  example: |
    {"customerId": "uuid-v4", "count": 1, "items": [{"code": "X1"}]}
responses:
  - status: 201
    description: Created
    fields:
      - { name: status, description: Envelope status, type: String, mandatory: M, example: "Success" }
      - { name: data, description: Payload, type: Object, mandatory: M, object: AccountResponse }
    objects:
      Item:
        - { name: code, description: Item code, type: String, mandatory: M, example: "X1" }
      AccountResponse:
        - { name: accountId, description: New account id, type: String, mandatory: M, example: "uuid-v4" }
    example: |
      {"status": "Success", "data": {"accountId": "uuid-v4"}}
  - status: 400
    description: Bad Request
    fields:
      - { name: responseCode, description: Outcome class, type: String, mandatory: M, example: "001" }
      - { name: errorCode, description: Catalog code, type: String, mandatory: M, example: "LEG-1002" }
      - { name: errorMessage, description: Support message, type: String, mandatory: M, example: "Invalid field format: customerId" }
    example: |
      {"responseCode": "001", "errorCode": "LEG-1002", "errorMessage": "Invalid field format: customerId"}
business_logic: |
  1. Validate the request.
  2. Create the account and return its id.
errors:
  - { status: 400, responseCode: "001", code: LEG-1002, message: "Invalid field format", description: "Malformed field; append the field name when known" }
