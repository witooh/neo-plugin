info:
  name: Get Account
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/v1/accounts/:accountId"
  params:
    - name: accountId
      value: "{{accountId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() { expect(res.status).to.equal(200); });

settings:
  encodeUrl: true

docs: |-
  ## Purpose

  Read one account.

  ## Request

  ### Endpoint

  `GET /v1/accounts/{accountId}`

  ### Auth

  `None`

  ### Path Parameters

  | Field Name | Type | Mandatory | Description | Possible Value |
  |---|---|---|---|---|
  | accountId | String | Yes | Account id | `"uuid-v4"` |

  ## Response

  ### HTTP Status: 200

  | Field Name | Type | Mandatory | Description | Possible Value |
  |---|---|---|---|---|
  | status | String | Yes | Envelope status | `"Success"` |
  | data | Object | Yes | Payload | see below |
  | data.accountId | String | Yes | Account id | `"uuid-v4"` |
