name: Test Plugin Installation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-skills:
    name: Validate skill content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate all skills
        run: node scripts/validate-skills.js

      - name: Validate agent guidance source of truth
        run: node scripts/validate-agent-guidance.js

      - name: Validate GitHub Copilot plugin
        run: node scripts/validate-copilot-plugin.js

  test-copilot-install:
    name: Test Copilot plugin installation
    needs: [validate-skills]
    runs-on: ubuntu-latest
    env:
      COPILOT_HOME: ${{ runner.temp }}/copilot-home
      COPILOT_CACHE_HOME: ${{ runner.temp }}/copilot-cache
      COPILOT_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Add local marketplace
        run: copilot plugin marketplace add .

      - name: Install neo from the marketplace
        run: copilot plugin install neo@neo

      - name: List installed Copilot plugins
        run: copilot plugin list

  validate:
    name: Validate plugin structure
    needs: [validate-skills]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  test-install:
    name: Test plugin installation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install neo@neo --scope user
